
{% extends "base.html" %}

{% block content %}
<section class="apply-section">
    <div class="apply-container">
        <h1>Apply for Job</h1>
        <p class="apply-subtitle">Complete the form to apply for this position.</p>

        <form action="{{ url_for('apply_job', job_id=job.id) }}"
              method="POST" enctype="multipart/form-data">

            <label for="applicant_name">Full Name</label>
            <input
                type="text"
                id="applicant_name"
                name="applicant_name"
                placeholder="Enter your full name"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email address"
                required
            >

            <label for="resume">Upload Resume (PDF)</label>
            <input
                type="file"
                id="resume"
                name="resume"
                accept=".pdf"
                required
            >

            <button type="submit" class="apply-btn">
                Submit Application
            </button>
        </form>
    </div>
</section>
{% endblock %}
